name: Build and Upload Artifact  

on: [push]  

jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout code  
        uses: actions/checkout@v4  

      - name: Generate a dummy file  
        run: echo "Hello, GitHub Actions!" > output.txt  

      - name: Upload Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: my-artifact  
          path: output.txt  
