name: Secure Secrets Demo

on: [push]

jobs:
  secure-demo:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Show secure credential usage
      env:
        API_KEY: ${{ secrets.API_KEY }}
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Connecting to database securely"
        echo "API key length: ${#API_KEY} characters (hidden in logs)"
        echo "DB password length: ${#DB_PASS} characters (hidden in logs)"
        
    - name: Simulate secure API call
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        echo "Making API call with secret key"
        echo "Response: Success (key remains secure)"
