name: Secrets Demo Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  demo-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Show secrets (masked in logs)
      run: |
        echo "API key is: ${{ secrets.API_KEY }}"
        echo "DB password is: ${{ secrets.DB_PASSWORD }}"
        
    - name: Use secrets in Python script
      env:
        API_KEY: ${{ secrets.API_KEY }}
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Running Python script with secrets..."
        python -c "import os; print(f'API key length: {len(os.environ[\"API_KEY\"])} chars')"
        python -c "import os; print(f'DB password length: {len(os.environ[\"DB_PASS\"])} chars')"
        # Note: Actual secret values won't be printed in logs
